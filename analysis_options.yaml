include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/*.gen.dart"
    - "build/**"
    - ".dart_tool/**"

  errors:
    avoid_print: warning
    cancel_subscriptions: warning
    close_sinks: warning
    collection_methods_unrelated_type: warning
    dead_code: warning
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning
    empty_catches: warning
    must_be_immutable: warning
    noop_primitive_operations: warning
    only_throw_errors: warning
    todo: warning
    throw_in_finally: warning
    unnecessary_await_in_return: warning
    unnecessary_breaks: warning
    unnecessary_const: warning
    unnecessary_late: warning
    unnecessary_overrides: warning
    unnecessary_statements: warning
    unnecessary_this: warning
    use_build_context_synchronously: warning

linter:
  rules:
    - avoid_field_initializers_in_const_classes
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - empty_catches
    - noop_primitive_operations
    - only_throw_errors
    - throw_in_finally
    - unnecessary_await_in_return
    - unnecessary_breaks
    - unnecessary_const
    - unnecessary_late
    - unnecessary_overrides
    - unnecessary_statements
    - unnecessary_this
    - use_build_context_synchronously
